<!DOCTYPE html>
<!--
  INWAY - ACCEPT.HTM
  "2.253 wants to control this PC" with Accept and Cancel.
  Opened by HTMLUI_ASK() with ShowHTMLDialog. The texts arrive in
  window.dialogArguments, one per line:
    0 who, 1 title (%s = who), 2 text, 3 accept, 4 cancel,
    5 countdown (%d = seconds), 6 seconds
  The answer goes back in window.returnValue: "accept", "cancel" or "timeout".
  Written for old MSHTML too: no flexbox, no addEventListener.
-->
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>INWAY</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
body {
	background: #15181e;
	color: #e9ecf2;
	font-family: "Segoe UI", Tahoma, Arial, sans-serif;
	font-size: 14px;
	cursor: default;
}
#bar { position: absolute; left: 0; top: 0; width: 100%; height: 4px; background: #2a2f39; }
#fill { width: 100%; height: 4px; background: #f2c94c; }
#icon {
	position: absolute; left: 24px; top: 28px; width: 48px; height: 48px;
	border-radius: 12px; background: #2f6fed; color: #ffffff;
	font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets", "Segoe UI Symbol";
	font-size: 24px; line-height: 48px; text-align: center;
}
#text { position: absolute; left: 90px; right: 24px; top: 24px; }
h1 { margin: 0 0 6px 0; font-size: 18px; font-weight: 600; line-height: 1.25; }
h1 b { color: #f2c94c; font-weight: 700; }
p { margin: 0; color: #a7afbf; font-size: 13px; line-height: 1.45; }
#count { position: absolute; left: 24px; right: 24px; bottom: 74px; color: #7c8496; font-size: 12px; }
button {
	position: absolute; bottom: 20px; width: 206px; height: 42px;
	border: 0; border-radius: 8px;
	font-family: "Segoe UI", Tahoma, Arial, sans-serif;
	font-size: 15px; font-weight: 600; cursor: pointer;
}
#ok { left: 24px; background: #22a35a; color: #ffffff; }
#ok:hover { background: #28b866; }
#no { right: 24px; background: #343a46; color: #e9ecf2; }
#no:hover { background: #434a58; }
button.wait, button.wait:hover { background: #2a2f39; color: #6f7686; cursor: default; }
</style>
</head>
<body>
<div id="bar"><div id="fill"></div></div>
<div id="icon">&#xE7F4;</div>
<div id="text"><h1 id="title"></h1><p id="line"></p></div>
<div id="count"></div>
<button id="ok" class="wait"></button>
<button id="no" class="wait"></button>
<script type="text/javascript">
window.onerror = function () { return true; };
document.oncontextmenu = function () { return false; };
document.onselectstart = function () { return false; };

var A = String(window.dialogArguments || "").split("\n");
var WHO = A[0] || "?";
var SECONDS = parseInt(A[6], 10) || 60;
var START = new Date().getTime();
var READY = false;
var DONE = false;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function finish(answer) {
	if (DONE) { return; }
	DONE = true;
	window.returnValue = answer;
	window.close();
}

function tick() {
	var left = SECONDS - Math.floor((new Date().getTime() - START) / 1000);
	if (left <= 0) { finish("timeout"); return; }
	$("count").innerText = (A[5] || "%d").replace("%d", left);
	$("fill").style.width = Math.max(0, 100 * left / SECONDS) + "%";
	setTimeout(tick, 250);
}

$("title").innerHTML = esc(A[1] || "%s").replace("%s", "<b>" + esc(WHO) + "</b>");
$("line").innerText = A[2] || "";
$("ok").innerText = A[3] || "Accept";
$("no").innerText = A[4] || "Cancel";
$("ok").onclick = function () { if (READY) { finish("accept"); } };
$("no").onclick = function () { if (READY) { finish("cancel"); } };

/* The buttons wake up after a moment, so a click meant for something else
   cannot accept by accident. Enter and Space do nothing: it must be a click. */
setTimeout(function () {
	READY = true;
	$("ok").className = "";
	$("no").className = "";
}, 800);

document.onkeydown = function (e) {
	var k = (e || window.event).keyCode;
	if (k === 27) { finish("cancel"); }
	return false;
};

tick();
</script>
</body>
</html>
