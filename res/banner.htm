<!DOCTYPE html>
<!--
  INWAY - BANNER.HTM
  "2.253 is controlling this PC" with a Disconnect button, in the corner of
  the shared screen for the whole session. Opened by HTMLUI_BANNER_SHOW().
  window.dialogArguments, one per line: 0 who, 1 text (%s = who), 2 button.
  window.returnValue = "stop" when Disconnect is clicked.
  Keys do nothing here, so typing from the other PC can never press the button.
-->
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>INWAY</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
body {
	background: #15181e;
	color: #e9ecf2;
	font-family: "Segoe UI", Tahoma, Arial, sans-serif;
	font-size: 14px;
	cursor: default;
	border-left: 4px solid #f2c94c;
}
#dot {
	position: absolute; left: 18px; top: 31px; width: 12px; height: 12px;
	border-radius: 6px; background: #ef5350;
	animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: .25; } 100% { opacity: 1; } }
#text {
	position: absolute; left: 42px; right: 152px; top: 0; height: 74px;
	display: table;
}
#text span { display: table-cell; vertical-align: middle; line-height: 1.3; }
#text b { color: #f2c94c; }
#stop {
	position: absolute; right: 16px; top: 16px; width: 124px; height: 42px;
	border: 0; border-radius: 8px; background: #c94040; color: #ffffff;
	font-family: "Segoe UI", Tahoma, Arial, sans-serif;
	font-size: 14px; font-weight: 600; cursor: pointer;
}
#stop:hover { background: #dd4b4b; }
</style>
</head>
<body>
<div id="dot"></div>
<div id="text"><span id="line"></span></div>
<button id="stop" tabindex="-1"></button>
<script type="text/javascript">
window.onerror = function () { return true; };
document.oncontextmenu = function () { return false; };
document.onselectstart = function () { return false; };
document.onkeydown = function () { return false; };

var A = String(window.dialogArguments || "").split("\n");

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

$("line").innerHTML = esc(A[1] || "%s").replace("%s", "<b>" + esc(A[0] || "?") + "</b>");
$("stop").innerText = A[2] || "Disconnect";
$("stop").onclick = function () {
	window.returnValue = "stop";
	window.close();
};

/* Bottom right corner, above the taskbar */
try {
	var W = parseInt(window.dialogWidth, 10) || 420;
	var H = parseInt(window.dialogHeight, 10) || 74;
	window.dialogLeft = (screen.availWidth - W - 24) + "px";
	window.dialogTop = (screen.availHeight - H - 72) + "px";
} catch (e) {}
</script>
</body>
</html>
